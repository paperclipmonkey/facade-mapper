# Geometry and calibration tests, plus a parse check over every module.
#
# The app has no build step and no dependencies, so this needs nothing but Node.
# The tests that matter are the ones covering the homography solve and marker
# detection — the parts where a subtle error produces a projection that looks
# plausible and lands in the wrong place.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every module parses
        run: |
          status=0
          node --check server.mjs || exit 1
          for file in $(find js -name '*.js' | sort); do
            cp "$file" /tmp/check.mjs
            if ! node --check /tmp/check.mjs; then
              echo "::error file=$file::failed to parse"
              status=1
            fi
          done
          exit $status

      - name: Geometry and calibration tests
        run: node test/geometry.test.mjs

      - name: Motion, trigger, schedule and grading tests
        run: node test/runtime.test.mjs

      - name: Surface collision tests
        run: node test/collide.test.mjs

      - name: Facade collision and edge-blending tests
        run: node test/obstacles.test.mjs

      - name: Effect behaviour tests
        run: node test/effects.test.mjs

      - name: Starter preset tests
        run: node test/presets.test.mjs

      - name: Figure orientation tests
        run: node test/figures.test.mjs

      - name: Command palette tests
        run: node test/palette.test.mjs

      - name: Layer diagnostic tests
        run: node test/diagnostics.test.mjs

      - name: Brickwork and breach tests
        run: node test/brickwork.test.mjs

      - name: Flowers and print tests
        run: node test/floral.test.mjs

      - name: One-shot burst tests
        run: node test/bursts.test.mjs

      - name: Depth scan pipeline tests
        run: node test/depth.test.mjs

      - name: glTF scan reader tests
        run: node test/glb.test.mjs

      - name: Depth scan storage, placement and field tests
        run: node test/scan.test.mjs

      - name: Scan pipeline against a realistic garden
        run: node test/scanreal.test.mjs

      - name: Cross-device link, clock sync and relay tests
        run: node test/link.test.mjs
