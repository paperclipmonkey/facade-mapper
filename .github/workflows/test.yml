# Every test in test/, plus a parse check over every module.
#
# The app has no build step and no dependencies, so this needs nothing but Node.
# The tests that matter most are the ones covering the homography solve and
# marker detection — the parts where a subtle error produces a projection that
# looks plausible and lands in the wrong place — and the whole-library sweep,
# which is the only thing that notices an effect quietly drawing nothing.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every module parses
        run: |
          status=0
          node --check server.mjs || exit 1
          for file in $(find js -name '*.js' | sort); do
            cp "$file" /tmp/check.mjs
            if ! node --check /tmp/check.mjs; then
              echo "::error file=$file::failed to parse"
              status=1
            fi
          done
          exit $status

      # Every test file, found rather than listed.
      #
      # This used to be one named step per test, which reads beautifully in the
      # checks list and quietly stopped being true: two suites — the wall
      # rectification maths and the cross-tab sync — were added, were run by
      # hand, passed, and never ran here again. Nothing failed. Nothing said
      # anything. They were simply not in the list, and a list of files kept by
      # hand next to a directory of files is a list that will disagree with it.
      #
      # A loop cannot drift. The grouping keeps the log as readable as the
      # separate steps were — one collapsible section per suite — and the
      # failures are collected rather than exiting on the first, so one broken
      # suite does not hide the state of the rest.
      - name: Every test
        run: |
          status=0
          failed=""
          for file in $(ls test/*.test.mjs | sort); do
            echo "::group::$file"
            if node "$file"; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error file=$file::suite failed"
              failed="$failed $file"
              status=1
            fi
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
          fi
          exit $status
