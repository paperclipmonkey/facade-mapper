<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" width="260" height="120" role="img" aria-label="Facade Mapper">
  <!--
    A projector on the lawn throwing light up at a house: the demo's hipped-roof
    semi, reduced to a mark. The beam runs into the wall rather than stopping
    short of it, because light that lands is the entire idea; and the traced
    outlines and their handles sit on top of the light, as they do in the app.
  -->
  <defs>
    <linearGradient id="beam" x1="34" y1="0" x2="150" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb066" stop-opacity="0.9" />
      <stop offset="0.5" stop-color="#ff7a18" stop-opacity="0.36" />
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0.16" />
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd59a" />
      <stop offset="1" stop-color="#ff6a1a" />
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb84d" />
      <stop offset="1" stop-color="#e2561a" />
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1f22" />
      <stop offset="0.35" stop-color="#1a1d27" />
      <stop offset="1" stop-color="#161a24" />
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf2" />
      <stop offset="0.5" stop-color="#ffc27a" />
      <stop offset="1" stop-color="#ff7a18" />
    </radialGradient>
  </defs>

  <!-- The throw: keystoned, because the projector is low and pointing up. -->
  <path d="M38 80 L150 28 L150 108 Z" fill="url(#beam)" />

  <!-- The projector, on its feet. -->
  <rect x="6" y="68" width="30" height="22" rx="5" fill="#2a3040" />
  <rect x="10" y="90" width="5" height="4" rx="1" fill="#2a3040" />
  <rect x="27" y="90" width="5" height="4" rx="1" fill="#2a3040" />
  <circle cx="36" cy="79" r="7.5" fill="url(#lens)" />

  <!-- Chimney, then the hipped roof, then the wall. -->
  <rect x="198" y="12" width="12" height="20" fill="#2b3142" />
  <rect x="196" y="10" width="16" height="4" rx="1" fill="#3a4256" />
  <path d="M122 50 L146 24 L232 24 L246 50 Z" fill="#2b3142" />
  <path d="M118 52 L146 22 L234 22 L250 52" fill="none" stroke="#8b96ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="126" y="52" width="114" height="56" fill="url(#wall)" />

  <!-- Light where it landed: two bedrooms, the bay, and the door. -->
  <rect x="138" y="60" width="26" height="18" fill="url(#lit)" />
  <rect x="190" y="60" width="38" height="18" fill="url(#lit)" />
  <rect x="190" y="84" width="38" height="18" fill="url(#lit)" />
  <rect x="152" y="82" width="18" height="26" fill="url(#door)" />

  <!-- The traced outlines, over the light, and the handles you drag. -->
  <g fill="none" stroke="#4cc2ff" stroke-width="1.6">
    <rect x="138" y="60" width="26" height="18" />
    <rect x="190" y="60" width="38" height="18" />
    <rect x="190" y="84" width="38" height="18" />
    <rect x="152" y="82" width="18" height="26" />
    <path d="M126 52 L240 52 L240 108 L126 108 Z" stroke="#4cc2ff" stroke-opacity="0.6" />
  </g>
  <g fill="#4cc2ff" stroke="#0d1117" stroke-width="1">
    <circle cx="126" cy="52" r="3.4" />
    <circle cx="240" cy="52" r="3.4" />
    <circle cx="240" cy="108" r="3.4" />
    <circle cx="126" cy="108" r="3.4" />
  </g>
</svg>
