<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 120" width="260" height="120" role="img" aria-label="Facade Mapper">
  <!--
    A projector throwing light at a gable end, with the beam keystoned the way a
    real one is when it sits on the lawn and points up. The house is the demo
    facade's own geometry, so the mark and the app agree about what a house is.
  -->
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a18" stop-opacity="0.55" />
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb257" />
      <stop offset="1" stop-color="#ff5a1f" />
    </linearGradient>
  </defs>

  <!-- The throw. -->
  <path d="M26 60 L120 14 L120 106 Z" fill="url(#beam)" />

  <!-- The projector. -->
  <rect x="6" y="49" width="26" height="22" rx="4" fill="#2a3040" />
  <circle cx="30" cy="60" r="7" fill="#ff7a18" />
  <circle cx="30" cy="60" r="3" fill="#fff3e6" />

  <!-- The gable end, traced. -->
  <path
    d="M124 52 L172 20 L220 52 L220 104 L124 104 Z"
    fill="#161a24"
    stroke="#4a5468"
    stroke-width="2"
    stroke-linejoin="round"
  />
  <path d="M118 55 L172 15 L226 55" fill="none" stroke="#8b96ad" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Windows, lit. The traced outline is drawn over the light, as it is in the app. -->
  <rect x="136" y="60" width="26" height="22" fill="url(#lit)" />
  <rect x="182" y="60" width="26" height="22" fill="url(#lit)" />
  <rect x="136" y="60" width="26" height="22" fill="none" stroke="#39ff88" stroke-width="1.6" />
  <rect x="182" y="60" width="26" height="22" fill="none" stroke="#39ff88" stroke-width="1.6" />

  <!-- The door. -->
  <rect x="160" y="80" width="24" height="24" fill="#3a1d0d" />
  <rect x="160" y="80" width="24" height="24" fill="none" stroke="#39ff88" stroke-width="1.6" />

  <!-- Vertex handles, the thing you actually drag. -->
  <g fill="#39ff88">
    <circle cx="124" cy="52" r="3.2" />
    <circle cx="172" cy="20" r="3.2" />
    <circle cx="220" cy="52" r="3.2" />
    <circle cx="220" cy="104" r="3.2" />
    <circle cx="124" cy="104" r="3.2" />
  </g>
</svg>
