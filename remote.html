<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the blackout button can sit in the home-indicator
         area on a phone rather than above a strip of black that does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Remote — Facade Mapper</title>
    <meta name="description" content="Run a Facade Mapper show from a phone or a second laptop." />
    <meta name="theme-color" content="#0c0e13" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icons/app.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/remote.css" />
    <link rel="stylesheet" href="css/draw.css" />
  </head>
  <body class="remote-body">
    <header class="remote-bar">
      <span class="remote-dot" id="linkDot" data-link="checking" aria-hidden="true"></span>
      <span class="remote-show" id="showName">Facade Mapper</span>
      <span class="remote-time" id="showTime">00:00.0</span>
    </header>

    <nav class="remote-tabs" id="tabs" hidden aria-label="What this device is doing">
      <button type="button" class="tab on" id="tabControl" aria-pressed="true">Control</button>
      <button type="button" class="tab" id="tabGame" aria-pressed="false">Game</button>
      <button type="button" class="tab" id="tabDraw" aria-pressed="false">Draw</button>
    </nav>

    <p class="remote-notice" id="notice" role="status">Looking for the show…</p>

    <main class="remote-main" id="main" hidden>
      <button type="button" class="big blackout" id="btnBlackout">
        <span class="big-label">Blackout</span>
        <span class="big-sub" id="blackoutSub">everything off</span>
      </button>

      <section class="remote-section" id="scenesSection" hidden>
        <h2>Scenes</h2>
        <div class="grid" id="scenes"></div>
      </section>

      <section class="remote-section" id="triggersSection" hidden>
        <h2>Triggers</h2>
        <div class="grid" id="triggers"></div>
      </section>

      <section class="remote-section">
        <h2>Transport</h2>
        <div class="row">
          <button type="button" class="big" id="btnPlay"><span class="big-label">▶</span></button>
          <button type="button" class="big" id="btnStop"><span class="big-label">■</span></button>
          <button type="button" class="big" id="btnRunShow"><span class="big-label">Run show</span></button>
        </div>
        <label class="fader">
          <span class="fader-label">Master <output id="masterOut">100%</output></span>
          <input type="range" id="master" min="0" max="1" step="0.01" value="1" aria-label="Master brightness" />
        </label>
      </section>

      <section class="remote-section">
        <h2>Sound</h2>
        <button type="button" class="big" id="btnSound">
          <span class="big-label">Sound</span>
          <span class="big-sub">silent — press to turn it on</span>
        </button>
        <label class="fader">
          <span class="fader-label">Volume <output id="soundMasterOut">70%</output></span>
          <input type="range" id="soundMaster" min="0" max="1" step="0.01" value="0.7" aria-label="Overall sound volume" />
        </label>
      </section>

      <details class="remote-more" id="more">
        <summary>Effects, their volumes, projectors and the link</summary>

        <h2>Effects</h2>
        <div class="list" id="layers"></div>

        <h2>Projectors</h2>
        <div class="list" id="projectors"></div>

        <h2>This device</h2>
        <p class="remote-note" id="linkNote"></p>
      </details>
    </main>

    <!--
      The dare game, from the garden: the same YES / NO / DOOR / TREAT the real
      buttons send, and the diagram lit up with where the game is. For testing
      a ladder without walking to each button, and for the adult at the door
      who has the TREAT button in their pocket.
    -->
    <main class="remote-main game-root" id="gameRoot" hidden>
      <p class="game-state" id="gameState">The game is off.</p>
      <div class="game-alerts" role="group" aria-label="Tell me when the game moves on">
        <span>Tell me when it moves on:</span>
        <button type="button" class="chip" data-alert="sound" aria-pressed="false">🔔 Sound</button>
        <button type="button" class="chip" data-alert="flash" aria-pressed="false">⚡ Flash</button>
        <button type="button" class="chip" data-alert="buzz" aria-pressed="false">📳 Buzz</button>
      </div>
      <div class="game-pad">
        <button type="button" class="big game-btn game-yes" data-role="yes"><span class="big-label">YES</span></button>
        <button type="button" class="big game-btn game-no" data-role="no"><span class="big-label">NO</span><span class="big-sub">hold for mercy</span></button>
        <button type="button" class="big game-btn game-door" data-role="door"><span class="big-label">DOOR</span></button>
        <button type="button" class="big game-btn game-treat" data-role="treat"><span class="big-label">TREAT</span></button>
      </div>
      <div class="row">
        <button type="button" class="big" id="btnGameReset"><span class="big-label">Reset</span><span class="big-sub">back to the start</span></button>
        <button type="button" class="big" id="btnGameOn"><span class="big-label">Game on</span><span class="big-sub"></span></button>
      </div>
      <div class="game-graph-scroll"><div class="game-graph" id="gameGraph"></div></div>
      <section class="remote-section">
        <h2>Presses</h2>
        <div class="game-log" id="gameLog"></div>
      </section>
    </main>

    <!--
      The drawing surface, which is the same page rather than a second address:
      one device carried into the garden, one thing to open, and turning a
      layer off while holding the pencil does not mean switching tabs. It is
      mounted lazily and asks for the project only while it is open — see
      js/draw/pad.js.
    -->
    <section class="pad-root" id="padRoot" hidden>
      <canvas class="pad" data-pad="pad"></canvas>

      <div class="draw-notice" data-pad="notice" role="status">
        <p data-pad="noticeText">Looking for the show…</p>
        <button type="button" class="tool" data-pad="btnAddLayer" hidden>Add a drawing layer</button>
      </div>

      <header class="draw-head" data-pad="head">
        <select data-pad="surfacePicker" class="draw-select" aria-label="Which drawing layer"></select>
        <span class="draw-target" data-pad="targetName"></span>
      </header>

      <footer class="draw-bar" data-pad="bar">
        <div class="swatches" data-pad="swatches"></div>

        <label class="draw-width">
          <input type="range" data-pad="width" min="0.4" max="12" step="0.1" value="2.2" aria-label="Line width" />
          <span class="nib" data-pad="nib" aria-hidden="true"></span>
        </label>

        <div class="draw-tools">
          <button type="button" class="tool" data-pad="btnErase" aria-pressed="false">Rub out</button>
          <button type="button" class="tool" data-pad="btnUndo">Undo</button>
          <button type="button" class="tool" data-pad="btnClear">Clear</button>
          <button type="button" class="tool" data-pad="btnPencilOnly" aria-pressed="false" title="Ignore fingers and palms">Pencil</button>
        </div>
      </footer>
    </section>

    <!-- The flash, and the banner that says somebody is at the door. Over
         everything, on every tab, because that is the moment to get up. -->
    <div class="game-flash" id="gameFlash" hidden></div>
    <div class="game-door-banner" id="gameDoor" hidden></div>

    <div class="toast" id="toast" hidden></div>

    <script type="module" src="js/remote/app.js"></script>
  </body>
</html>
