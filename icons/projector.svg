      <stop offset="0" stop-color="#ffb066" stop-opacity="0.95" />
      <stop offset="1" stop-color="#ff7a18" stop-opacity="0.25" />
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffaf2" />
      <stop offset="0.5" stop-color="#ffc27a" />
      <stop offset="1" stop-color="#ff7a18" />
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#14171f" />
  <path d="M13 19 L29 8 L29 28 Z" fill="url(#beam)" />
  <rect x="3" y="14" width="12" height="10" rx="2.5" fill="#8b96ad" />
