<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Draw — Facade Mapper</title>
    <!--
      The drawing pad lives in the remote now.

      Carrying two addresses out to the garden was never one device: turning a
      layer off while holding the pencil meant leaving the page, waiting for a
      reconnect and losing your place. This address stays because it has been
      typed into tablets and printed into QR codes, and it goes straight to the
      pencil rather than to the buttons.
    -->
    <meta http-equiv="refresh" content="0; url=remote.html#draw" />
    <link rel="canonical" href="remote.html" />
    <link rel="stylesheet" href="css/base.css" />
  </head>
  <body>
    <p style="padding: 2rem; text-align: center">
      The drawing pad is part of the remote now.
      <a href="remote.html#draw">Open it</a>.
    </p>
    <script type="module">
      // The meta refresh is the fallback; this preserves the query string, which
      // is how a link key reaches the page.
      location.replace(`remote.html${location.search}#draw`);
    </script>
  </body>
</html>
