<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Facade Mapper — review harness</title>
    <style>
      html, body { margin: 0; background: #05070c; }
    </style>
  </head>
  <body>
    <script type="module">
      import { createProject, createLayer } from '../js/core/state.js';
      import { demoShapes, renderDemoFacade, DEMO_ASPECT } from '../js/control/demoHouse.js';
      import { applyPreset } from '../js/control/presets.js';
      import { defaultParams } from '../js/effects/registry.js';
      import { createWorldRenderer } from '../js/render/worldRenderer.js';
      import { createWarpRenderer } from '../js/render/warp.js';
      import { GRADE_PRESETS } from '../js/render/postfx.js';


      const TO_LINEAR = new Float32Array(256);
      for (let i = 0; i < 256; i++) {
        const c = i / 255;
        TO_LINEAR[i] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      }
      const LUT = 4096;
      const TO_SRGB = new Uint8ClampedArray(LUT + 1);
      for (let i = 0; i <= LUT; i++) {
        const l = i / LUT;
        TO_SRGB[i] = Math.round((l <= 0.0031308 ? l * 12.92 : 1.055 * l ** (1 / 2.4) - 0.055) * 255);
      }

      /** Facade plus projected light, summed in linear light. */
      function addLight(g, facade, light, W, H) {
        g.drawImage(facade, 0, 0, W, H);
        const base = g.getImageData(0, 0, W, H);
        const scratch = document.createElement('canvas');
        scratch.width = W;
        scratch.height = H;
        const sg = scratch.getContext('2d');
        sg.drawImage(light, 0, 0, W, H);
        const add = sg.getImageData(0, 0, W, H).data;
        const d = base.data;
        for (let i = 0; i < d.length; i += 4) {
          for (let c = 0; c < 3; c++) {
            const v = TO_LINEAR[d[i + c]] + TO_LINEAR[add[i + c]];
            d[i + c] = TO_SRGB[v >= 1 ? LUT : (v * LUT) | 0];
          }
        }
        g.putImageData(base, 0, 0);
      }

      const facades = new Map();
      const warps = new Map();

      function facadeFor(W, H) {
        const key = `${W}x${H}`;
        if (!facades.has(key)) facades.set(key, renderDemoFacade(W, H));
        return facades.get(key);
      }

      function warpFor(W, H) {
        const key = `${W}x${H}`;
        if (!warps.has(key)) {
          const lit = document.createElement('canvas');
          lit.width = W;
          lit.height = H;
          const warp = createWarpRenderer(lit, { preserveDrawingBuffer: true });
          warp.buildMesh({ H: null, region: { x: 0, y: 0, w: 1, h: 1 }, mesh: null });
          warps.set(key, { lit, warp });
        }
        return warps.get(key);
      }

      /**
       * One still. `job`:
       *   preset   — a starter id, applied to the demo house, or null
       *   layers   — [{ effect, tags, params, opacity, blend, softness, stagger, bindings }]
       *   grade    — a GRADE_PRESETS id (defaults to the preset's, else neutral)
       *   t, w, h, fps, facade (bool), bloom (bool), format ('png' | 'jpeg')
       */
      window.renderJob = (job) => {
        const W = job.w || 1600;
        const H = job.h || Math.round(W / DEMO_ASPECT);
        const seconds = job.t ?? 8;
        const FPS = job.fps || 12;

        // Ids are random, and effects seed themselves from them — so pin the
        // generator while the project is built, or every run is a different
        // picture and a before/after comparison means nothing.
        const realRandom = Math.random;
        const realNow = Date.now;
        let seed = 0x9e3779b9;
        Math.random = () => {
          seed = (seed + 0x6d2b79f5) | 0;
          let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
          return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
        };
        Date.now = () => 1767225600000;
        const project = createProject('review');
        project.worldAspect = DEMO_ASPECT;
        project.shapes = demoShapes();
        if (job.preset) applyPreset(project, job.preset);
        for (const [i, spec] of (job.layers || []).entries()) {
          const ids = spec.shapes
            ? project.shapes.filter((s) => spec.shapes.includes(s.name)).map((s) => s.id)
            : [];
          project.layers.push(createLayer(spec.effect, {
            name: spec.name || spec.effect,
            targets: ids,
            targetTags: spec.tags || [],
            params: { ...defaultParams(spec.effect), ...(spec.params || {}) },
            bindings: spec.bindings || {},
            opacity: spec.opacity ?? 1,
            blend: spec.blend || 'source-over',
            softness: spec.softness || 0,
            stagger: spec.stagger || 0,
            order: 1000 + i,
          }));
        }
        Math.random = realRandom;
        Date.now = realNow;
        if (job.grade || !job.preset) {
          const look = GRADE_PRESETS.find((g) => g.id === (job.grade || 'neutral'));
          project.settings = project.settings || {};
          project.settings.grade = { ...project.settings.grade, ...look.values };
        }

        const world = document.createElement('canvas');
        world.width = W;
        world.height = H;
        const worldCtx = world.getContext('2d');
        const renderer = createWorldRenderer({
          onEffectError: (e) => console.error(`effect ${e.effectId}: ${e.message}`),
        });

        const dt = 1 / FPS;
        const started = performance.now();
        for (let t = 0; t <= seconds + 1e-6; t += dt) {
          renderer.render(worldCtx, {
            project,
            time: { t, dt, beat: t * 2, beatPhase: (t * 2) % 1, bpm: 120 },
            audio: job.audio || { level: 0, low: 0, mid: 0, high: 0 },
            region: { x: 0, y: 0, w: 1, h: 1 },
            pixelSize: { w: W, h: H },
            preview: false,
          });
        }
        const simMs = performance.now() - started;

        const out = document.createElement('canvas');
        out.width = W;
        out.height = H;
        const g = out.getContext('2d');

        let light = world;
        if (job.bloom !== false) {
          const { lit, warp } = warpFor(W, H);
          warp.draw(world, {
            feather: { top: 0, right: 0, bottom: 0, left: 0 },
            gamma: 1.8,
            brightness: 1,
            grade: project.settings?.grade,
          });
          light = lit;
        }

        if (job.facade !== false && job.composite === 'srgb') {
          g.drawImage(facadeFor(W, H), 0, 0, W, H);
          g.globalCompositeOperation = 'lighter';
          g.drawImage(light, 0, 0, W, H);
          g.globalCompositeOperation = 'source-over';
        } else if (job.facade !== false) {
          addLight(g, facadeFor(W, H), light, W, H);
        } else {
          g.fillStyle = '#000';
          g.fillRect(0, 0, W, H);
          g.drawImage(light, 0, 0, W, H);
        }

        const format = job.format === 'jpeg' ? 'image/jpeg' : 'image/png';
        return {
          layers: project.layers.length,
          simMs: Math.round(simMs),
          data: out.toDataURL(format, 0.9),
        };
      };

      /** Just the facade, no light. */
      window.renderFacade = ({ w = 1600, h } = {}) => {
        const H = h || Math.round(w / DEMO_ASPECT);
        return renderDemoFacade(w, H).toDataURL('image/png');
      };

      /** Tile already-rendered stills into one labelled sheet. */
      window.composeSheet = async ({ images, labels, cols = 3, cellW = 800 }) => {
        const loaded = await Promise.all(images.map((src) => new Promise((resolve) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => resolve(null);
          img.src = src;
        })));
        const first = loaded.find(Boolean);
        const cellH = Math.round(cellW * (first ? first.height / first.width : 9 / 16));
        const labelH = 30;
        const rows = Math.ceil(images.length / cols);
        const sheet = document.createElement('canvas');
        sheet.width = cols * cellW + (cols + 1) * 6;
        sheet.height = rows * (cellH + labelH) + (rows + 1) * 6;
        const g = sheet.getContext('2d');
        g.fillStyle = '#16181d';
        g.fillRect(0, 0, sheet.width, sheet.height);
        loaded.forEach((img, i) => {
          const c = i % cols;
          const r = Math.floor(i / cols);
          const x = 6 + c * (cellW + 6);
          const y = 6 + r * (cellH + labelH + 6);
          g.fillStyle = '#e6e9ef';
          g.font = '600 20px system-ui, sans-serif';
          g.textBaseline = 'middle';
          g.fillText(labels[i] || '', x + 4, y + labelH / 2);
          if (img) g.drawImage(img, x, y + labelH, cellW, cellH);
        });
        return sheet.toDataURL('image/jpeg', 0.88);
      };

      window.__ready = true;
    </script>
  </body>
</html>
